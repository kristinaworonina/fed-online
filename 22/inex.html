<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style/style.css">
    <title>Dz22</title>
</head>

<body>
    <main>
        <div class="first-row">
            <button class="fill-in">
                Fill in
            </button>

            <button class="glowing">
                Glowing
            </button>

            <button class="fill-up">
                Fill up
            </button>
        </div>

        <div class="second-row">
            <button class="slide">
                Slide
            </button>

            <button class="raise">
                Raise
            </button>

            <button class="close">
                Close
            </button>
        </div>

        <div class="third-row">
            <button class="notify-me">
                Notify me
            </button>

            <button class="hover-me">
                Hover me
            </button>

            <button class="zoom">
                Zoom
            </button>
        </div>

        <div class="forth-row">
            <button class="offset">
                Offset
            </button>

                <button class="explore-more">
                    Explore More <i class="fa-solid fa-arrow-right"></i>
                </button>
            


            <button class="fancy-button">
                Fancy button
            </button>
        </div>

        <div class="fifth-row">
            <button class="hover-me-round">
                Hover me
            </button>

            <button class="explore-flip">
                Explore Me
            </button>
        </div>

    </main>
</body>

</html>
